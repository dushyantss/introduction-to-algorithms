[project]
name = "algorithms"
version = "0.1.0"
description = "CLRS Introduction to Algorithms, 4th Edition"
requires-python = ">=3.14"
dependencies = []

[dependency-groups]
dev = [
    "hypothesis>=6.151.9",
    "pytest>=9.0.2",
    "ruff>=0.15.7",
    "ty>=0.0.24",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py314"
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
